<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results | Cloud Advisor</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="logo">Cloud Advisor</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="assessment.html">Assessment</a>
        <a href="history.html">History</a>
      </div>
    </nav>
    <header class="page-header">
      <h1>Your Cloud Recommendation</h1>
      <p>Based on your answers, here is the ranking of cloud providers.</p>
    </header>

    <section class="card elevated" id="result-card">
      <div class="result-header">
        <h2 id="top-provider">Loading...</h2>
        <span class="badge" id="confidence">Confidence: --</span>
      </div>
      <div class="score-grid" id="score-grid"></div>
      <h3>Top Reasons</h3>
      <ul id="reasons-list"></ul>
      <h3>Recommended Services</h3>
      <div id="services-list" class="services-grid"></div>
      <h3>Why this cloud?</h3>
      <p id="explanation"></p>
    </section>

    <div class="actions">
      <a class="button" href="assessment.html">Run another assessment</a>
      <a class="button ghost" href="index.html">Back to home</a>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
