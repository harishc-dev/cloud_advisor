<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment | Cloud Advisor</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Project Assessment</h1>
      <p>Fill out the form below. We will recommend the best cloud provider for your project.</p>
    </header>

    <form id="assessment-form" class="card">
      <div class="grid">
        <label>
          Name
          <input type="text" name="name" required maxlength="120" />
        </label>
        <label>
          Email
          <input type="email" name="email" required maxlength="160" />
        </label>
        <label>
          Industry / Field
          <input type="text" name="industry" required maxlength="120" />
        </label>
        <label>
          Project type / Use case
          <select name="project_type" required>
            <option value="">Select...</option>
            <option>Web app</option>
            <option>Mobile backend</option>
            <option>AI/ML</option>
            <option>Analytics</option>
            <option>E-commerce</option>
            <option>Internal app</option>
            <option>Other</option>
          </select>
        </label>
        <label>
          Project scale
          <select name="project_scale" required>
            <option value="">Select...</option>
            <option>Personal</option>
            <option>Startup</option>
            <option>SMB</option>
            <option>Enterprise</option>
          </select>
        </label>
        <label>
          Monthly budget range
          <select name="budget_range" required>
            <option value="">Select...</option>
            <option>&lt;$100</option>
            <option>$100-$500</option>
            <option>$500-$2,000</option>
            <option>$2,000-$10,000</option>
            <option>$10,000+</option>
          </select>
        </label>
        <label>
          Primary user region / location
          <input type="text" name="primary_region" required maxlength="120" />
        </label>
        <label>
          Expected active users
          <select name="active_users" required>
            <option value="">Select...</option>
            <option>&lt;1,000</option>
            <option>1,000-10,000</option>
            <option>10,000-100,000</option>
            <option>100,000+</option>
          </select>
        </label>
        <label>
          Traffic pattern
          <select name="traffic_pattern" required>
            <option value="">Select...</option>
            <option>Steady</option>
            <option>Moderate spikes</option>
            <option>Heavy spikes</option>
          </select>
        </label>
        <label>
          Database needed?
          <select name="database_needed" required>
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>
          File storage needed?
          <select name="file_storage_needed" required>
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>
          AI/ML requirement level
          <select name="ai_requirement" required>
            <option value="">Select...</option>
            <option>None</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </label>
        <label>
          Microsoft integration importance
          <select name="microsoft_integration" required>
            <option value="">Select...</option>
            <option>Not important</option>
            <option>Nice to have</option>
            <option>Important</option>
            <option>Critical</option>
          </select>
        </label>
        <label>
          Ease of use vs advanced control
          <select name="ease_vs_control" required>
            <option value="">Select...</option>
            <option>Prefer ease of use</option>
            <option>Balanced</option>
            <option>Prefer advanced control</option>
          </select>
        </label>
        <label>
          Existing cloud/provider
          <select name="existing_provider" required>
            <option value="">Select...</option>
            <option>None</option>
            <option>AWS</option>
            <option>Azure</option>
            <option>GCP</option>
            <option>Other</option>
          </select>
        </label>
        <label>
          Compliance/security requirement
          <select name="compliance_requirement" required>
            <option value="">Select...</option>
            <option>Basic</option>
            <option>Moderate</option>
            <option>Strict</option>
          </select>
        </label>
        <label>
          Support requirement
          <select name="support_requirement" required>
            <option value="">Select...</option>
            <option>Community</option>
            <option>Business hours</option>
            <option>24/7 enterprise</option>
          </select>
        </label>
      </div>

      <button class="button primary" type="submit">Get Recommendation</button>
      <div id="form-message" class="form-message" aria-live="polite"></div>
    </form>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
